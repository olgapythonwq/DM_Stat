{% extends 'mailing/base.html' %}
{% block content %}
  <h2>Сброс пароля</h2>
  <p>Введите ваш email, и мы отправим ссылку для сброса пароля.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Отправить</button>
  </form>
{% endblock %}
