{% extends 'mailings/base.html' %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
  <div class="container mt-4">
    <h2>Удаление сообщения</h2>
    <p>Вы уверены, что хотите удалить сообщение с темой: <strong>{{ message.subject }}</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Удалить сообщение</button>
      <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отменить</a>
    </form>
  </div>
{% endblock %}
